<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Gerado - CleitonRBLX</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'gradient': 'gradient 8s ease infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-gradient { animation: gradient 8s ease infinite; }
    </style>
</head>
<body class="bg-black min-h-screen text-white overflow-x-hidden">
    <!-- Header -->
    <header class="relative z-10 border-b border-blue-900/30">
        <nav class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-center">
                <span class="text-xl font-bold">CleitonRBLX</span>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <section class="min-h-[80vh] flex items-center justify-center bg-gradient-to-br from-black via-blue-900/10 to-black">
        <div class="container mx-auto px-4">
            <div class="max-w-md mx-auto">
                <h1 class="text-4xl font-bold text-center mb-8">Gerador de Servidor Privado</h1>
                
                <form id="serverForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Seu Nome no Roblox</label>
                        <input type="text" id="playerName" required 
                               class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="Digite seu nome do Roblox">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2">Jogo</label>
                        <select id="gameSelect" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors">
                            <option value="steal-brainrot">Roube um Brainrot</option>
                        </select>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl text-lg transition-all duration-300 transform hover:scale-105">
                        GERAR SERVIDOR 🚀
                    </button>
                </form>

                <!-- Loading Animation -->
                <div id="loading" class="hidden mt-8 text-center">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-blue-300">Gerando seu servidor privado...</p>
                </div>

                <!-- Success Popup -->
                <div id="successPopup" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                    <div class="bg-neutral-900 border border-green-500/30 rounded-2xl p-8 max-w-md mx-4">
                        <div class="text-center">
                            <div class="w-16 h-16 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-feather="check" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4">Servidor Gerado com Sucesso!</h3>
                            <p class="text-neutral-300 mb-6">
                                Seu servidor privado foi criado! Agora você pode acessar o jogo com todas as vantagens exclusivas.
                            </p>
                            <button onclick="closePopup()" 
                                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300">
                                CONTINUAR
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        feather.replace();
        
        document.getElementById('serverForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const playerName = document.getElementById('playerName').value;
            const gameSelect = document.getElementById('gameSelect').value;
            
            if (!playerName.trim()) {
                alert('Por favor, digite seu nome do Roblox!');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('serverForm').classList.add('hidden');
            
            // Fake loading for 3 seconds
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('successPopup').classList.remove('hidden');
            }, 3000);
        });

        function closePopup() {
            document.getElementById('successPopup').classList.add('hidden');
            document.getElementById('serverForm').classList.remove('hidden');
            document.getElementById('playerName').value = '';
        }
    </script>
</body>
</html>
